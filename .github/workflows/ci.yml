name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Lehetővé teszi a manuális indítást is

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kód
        uses: actions/checkout@v4

      - name: JDK 17 beállítása
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle beállítása (gyorsítótárral)
        uses: gradle/actions/setup-gradle@v4

      - name: Futtathatóvá tétel
        run: chmod +x gradlew

      - name: Build és Teszt (Debug)
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace

      - name: APK feltöltése (opcionális)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
