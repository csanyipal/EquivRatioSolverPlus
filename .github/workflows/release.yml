name: Release Build

on:
  push:
    tags:
      - 'v*' # Csak a v-vel kezdődő tagek esetén indul
  workflow_dispatch: # Manuális indítás engedélyezése

permissions:
  contents: write # Szükséges a Release létrehozásához és fájlok feltöltéséhez

jobs:
  build-release:
    runs-on: ubuntu-24.04   # Amíg az Ubuntu 26.04-re való átállás meg nem történik, ez stabil marad
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ runner.temp }}/release-key.jks

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') # Csak tag push esetén fut
        uses: softprops/action-gh-release@v2
        with:
          #files: app/build/outputs/apk/release/*.apk
	  files: app/build/outputs/apk/release/app-release.apk#EquivRatioSolverPlus-${{ github.ref_name }}.apk
          generate_release_notes: true